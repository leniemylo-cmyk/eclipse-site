[build]
  publish = "."
  # Netlify ne redéploie que si la coque du site change (index.html ou ce fichier).
  # Tout le reste — édition du jour, archives, textes, langues, menu (edition.html, editions/, archives.json,
  # site.json, lang-*.json, formations.json) — est lu par la page directement sur GitHub :
  # le modifier ne déclenche aucun déploiement et ne consomme aucun crédit Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # La page ne peut parler qu’à elle-même et au dépôt GitHub public qui porte son contenu.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
